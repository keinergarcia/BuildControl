    <title>BuildControl</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages sirve 404.html para rutas desconocidas. 404.html guarda la
      // ruta original en sessionStorage y redirige aquí; este script la restaura
      // para que el enrutador (con basename) la interprete correctamente.
      (function () {
        var redirect = sessionStorage.getItem("bc.redirect");
        if (redirect) {
          sessionStorage.removeItem("bc.redirect");
          history.replaceState(null, "", redirect);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
